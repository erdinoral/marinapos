# OPSIYONEL: GitHub Secrets tam ise CI'dan yayin. Varsayilan yol: npm run release:publish (yerel .env.local)
name: Release Windows (CI — opsiyonel)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (ornegin 1.8.9)"
        required: true
        default: "1.9.0"
        type: string

permissions:
  contents: write

concurrency:
  group: release-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ format('refs/tags/{0}', inputs.tag) }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: node scripts/extract-release-notes.mjs

      - name: Supabase license config (CI — secret gerekli)
        shell: pwsh
        env:
          MARINA_SUPABASE_URL: ${{ secrets.MARINA_SUPABASE_URL || vars.MARINA_SUPABASE_URL }}
          MARINA_SUPABASE_ANON_KEY: ${{ secrets.MARINA_SUPABASE_ANON_KEY || vars.MARINA_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          MARINA_LICENSE_APP_CODE: ${{ secrets.MARINA_LICENSE_APP_CODE || vars.MARINA_LICENSE_APP_CODE }}
        run: |
          $hasUrl = [bool]($env:NEXT_PUBLIC_SUPABASE_URL -or $env:MARINA_SUPABASE_URL)
          $hasAnon = [bool]($env:NEXT_PUBLIC_SUPABASE_ANON_KEY -or $env:MARINA_SUPABASE_ANON_KEY)
          if (-not $hasUrl -or -not $hasAnon) {
            Write-Error @"
          CI secret yok. Yerel yayin kullanin:
            `$env:MARINA_LICENSE_APP_CODE='marina-pos'
            npm run release:publish
          veya release\ klasorundeki 3 dosyayi GitHub Release'e elle yukleyin.
          "@
            exit 1
          }
          node scripts/write-supabase-license-from-env.mjs

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
        run: npm run build && npx electron-builder --win --publish always --config.npmRebuild=false
